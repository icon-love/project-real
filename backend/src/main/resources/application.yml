server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: admin-system-server
  # ---------------- 数据源 ----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true 表示库不存在时自动创建（需账号有建库权限）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admin_system}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # ---------------- 启动时自动执行建表脚本（幂等） ----------------
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      continue-on-error: false
  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  # ---------------- Jackson：时间输出为毫秒时间戳 ----------------
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: true

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# ---------------- 自定义配置 ----------------
admin:
  jwt:
    # JWT 签名密钥（生产环境务必通过环境变量覆盖）
    secret: ${JWT_SECRET:admin-system-jwt-secret-key-please-change-in-production-2026}
    # 有效期（小时）
    expire-hours: 24
  upload:
    # 上传文件存储目录（相对 backend 运行目录，可配置绝对路径）
    dir: ${UPLOAD_PATH:./uploads}

logging:
  level:
    com.admin: info
